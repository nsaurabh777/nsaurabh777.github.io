name = "ask-saurabh"
main = "src/worker.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated list of origins allowed to call this Worker.
# localhost / 127.0.0.1 on any port is always allowed for local testing.
ALLOWED_ORIGINS = "https://nsaurabh777.github.io"
MODEL = "gemini-3.6-flash"

# Native per-IP rate limiter — no dashboard resource to create.
# limit = requests allowed per `period` seconds (period must be 10 or 60).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# GEMINI_API_KEY is a secret, not a var:
#   npx wrangler secret put GEMINI_API_KEY
# Get a free key (no card) at https://aistudio.google.com/apikey
